<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrum - ML</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    letter-spacing: -0.5px;
    color: #000;
  }

  header h1 span {
    color: #c0392b;
  }

  #cards-row {
    display: flex;
    gap: 20px;
    width: 100%;
    max-width: 620px;
    margin-bottom: 28px;
  }

  .card {
    flex: 1;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 20px 32px;
    min-height: 280px;
    gap: 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    user-select: none;
  }

  .card:active { transform: scale(0.97); }

  .card.left  { background: #c2185b; }
  .card.right { background: #b71c1c; }

  .card-arrow {
    font-size: 28px;
    color: rgba(255,255,255,0.55);
    line-height: 1;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }

  .card.left  .card-arrow { left: 14px; }
  .card.right .card-arrow { right: 14px; }

  .card-number {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    line-height: 1;
  }

  .card-label {
    font-size: 1.15rem;
    font-weight: 500;
    color: #fff;
    text-align: center;
    line-height: 1.35;
    padding: 0 30px;
  }

  .card-chinese {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.65);
    text-align: center;
  }

  #buttons {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 11px 30px;
    border-radius: 50px;
    border: 1.5px solid #ccc;
    background: #fff;
    color: #333;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }

  .btn:hover { background: #f5f5f5; border-color: #aaa; }
  .btn:active { transform: scale(0.96); }

  .btn-next {
    background: #b71c1c;
    color: #fff;
    border-color: #b71c1c;
    padding: 12px 38px;
    font-size: 1rem;
  }

  .btn-next:hover { background: #c0392b; border-color: #c0392b; }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }
</style>
</head>
<body>

<header>
  <h1>Spectrum &mdash; <span>ML</span></h1>
</header>

<div id="cards-row">
  <div class="card left" id="card-left" onclick="goBack()">
    <span class="card-arrow">&#8592;</span>
    <div class="card-number">#0</div>
    <div class="card-label" id="left-label">–</div>
    <div class="card-chinese" id="left-chinese"></div>
  </div>
  <div class="card right" id="card-right" onclick="goNext()">
    <span class="card-arrow">&#8594;</span>
    <div class="card-number">#100</div>
    <div class="card-label" id="right-label">–</div>
    <div class="card-chinese" id="right-chinese"></div>
  </div>
</div>

<div id="buttons">
  <button class="btn btn-back" id="btn-back" onclick="goBack()">← Back</button>
  <button class="btn btn-next" id="btn-next" onclick="goNext()">Next →</button>
</div>

function dedup(arr) {
  const seen = new Set();
  return arr.filter(c => { const k = c.left+'|'+c.right; if(seen.has(k))return false; seen.add(k); return true; });
}

const cards = dedup(cardsData);
let history = [];
let current = -1;

function tr(t) { return translations[t] || ''; }

function render() {
  const c = cards[current];
  document.getElementById('left-label').textContent = c.left;
  document.getElementById('right-label').textContent = c.right;
  document.getElementById('left-chinese').textContent = tr(c.left);
  document.getElementById('right-chinese').textContent = tr(c.right);
  const bb = document.getElementById('btn-back');
  bb.disabled = history.length <= 1;
}

function rand() {
  let r; do { r = Math.floor(Math.random() * cards.length); } while (r === current); return r;
}

function goNext() {
  const idx = rand();
  history.push(idx);
  current = idx;
  render();
}

function goBack() {
  if (history.length <= 1) return;
  history.pop();
  current = history[history.length - 1];
  render();
}

goNext();
